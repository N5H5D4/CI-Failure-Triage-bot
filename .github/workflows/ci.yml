name: Universal CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  universal-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # NHẬN DIỆN MÔI TRƯỜNG 
      - name: Detect Project Stack
        id: detect
        run: |
          HAS_NODE="false"
          HAS_PYTHON="false"
          HAS_GO="false"
          HAS_RUST="false"
          HAS_JAVA="false"

          if [ -f "package.json" ]; then HAS_NODE="true"; fi
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -f "setup.py" ]; then HAS_PYTHON="true"; fi
          if [ -f "go.mod" ]; then HAS_GO="true"; fi
          if [ -f "Cargo.toml" ]; then HAS_RUST="true"; fi
          if [ -f "pom.xml" ] || [ -f "build.gradle" ]; then HAS_JAVA="true"; fi

          echo "has_node=$HAS_NODE" >> $GITHUB_OUTPUT
          echo "has_python=$HAS_PYTHON" >> $GITHUB_OUTPUT
          echo "has_go=$HAS_GO" >> $GITHUB_OUTPUT
          echo "has_rust=$HAS_RUST" >> $GITHUB_OUTPUT
          echo "has_java=$HAS_JAVA" >> $GITHUB_OUTPUT

          echo "Project Stack: Node=$HAS_NODE, Python=$HAS_PYTHON, Go=$HAS_GO, Rust=$HAS_RUST, Java=$HAS_JAVA"

      # JAVASCRIPT / TYPESCRIPT / REACT / VUE / NEXT.JS
      - name: Setup Node.js
        if: steps.detect.outputs.has_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: [Node] Install Dependencies
        if: steps.detect.outputs.has_node == 'true'
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi

      - name: [Node] Type Checking (TypeScript)
        id: node_typecheck
        if: steps.detect.outputs.has_node == 'true'
        continue-on-error: true
        run: |
          if [ -f "tsconfig.json" ]; then npx tsc --noEmit --pretty; else echo "No tsconfig.json found, skipping typecheck"; fi

      - name: [Node] Linter Check
        id: node_lint
        if: steps.detect.outputs.has_node == 'true'
        continue-on-error: true
        run: |
          npm run lint --if-present || npx eslint . --ext .ts,.tsx,.js,.jsx || true

      - name: [Node] Unit Tests (Logic)
        id: node_test
        if: steps.detect.outputs.has_node == 'true'
        continue-on-error: true
        run: |
          npm test --if-present -- --run || true

      - name: [Node] Build Project
        id: node_build
        if: steps.detect.outputs.has_node == 'true'
        continue-on-error: true
        run: |
          npm run build --if-present

      # PYTHON
      - name: Setup Python
        if: steps.detect.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: [Python] Install Dependencies
        if: steps.detect.outputs.has_python == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8 mypy || true

      - name: [Python] Type & Syntax Check
        id: py_lint
        if: steps.detect.outputs.has_python == 'true'
        continue-on-error: true
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: [Python] Unit Tests (Pytest)
        id: py_test
        if: steps.detect.outputs.has_python == 'true'
        continue-on-error: true
        run: |
          pytest || python -m unittest discover || true

      # GOLANG
      - name: Setup Go
        if: steps.detect.outputs.has_go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
        if: steps.detect.outputs.has_go == 'true'

      - name: [Go] Test & Build
        id: go_check
        if: steps.detect.outputs.has_go == 'true'
        continue-on-error: true
        run: |
          go test -v ./...
          go build ./...

      # KHỐI RUST
      - name: [Rust] Test & Check
        id: rust_check
        if: steps.detect.outputs.has_rust == 'true'
        continue-on-error: true
        run: |
          cargo check --all-targets
          cargo test --verbose

      # TỔNG HỢP
      - name: Final Pipeline Verification
        run: |
          FAILED=0
          
          # Kiểm tra Node
          if [ "${{ steps.node_typecheck.outcome }}" == "failure" ]; then echo "TypeScript errors detected"; FAILED=1; fi
          if [ "${{ steps.node_test.outcome }}" == "failure" ]; then echo "Node test suite failed"; FAILED=1; fi
          if [ "${{ steps.node_build.outcome }}" == "failure" ]; then echo "Node build failed"; FAILED=1; fi

          # Kiểm tra Python
          if [ "${{ steps.py_lint.outcome }}" == "failure" ]; then echo "Python syntax/lint errors detected"; FAILED=1; fi
          if [ "${{ steps.py_test.outcome }}" == "failure" ]; then echo "Python test suite failed"; FAILED=1; fi

          # Kiểm tra Go / Rust
          if [ "${{ steps.go_check.outcome }}" == "failure" ]; then echo "Go test or build failed"; FAILED=1; fi
          if [ "${{ steps.rust_check.outcome }}" == "failure" ]; then echo "Rust check or test failed"; FAILED=1; fi

          if [ $FAILED -ne 0 ]; then
            echo "Pipeline encountered failures. Complete diagnostics exported to logs."
            exit 1
          fi
          echo " Universal CI passed successfully!"